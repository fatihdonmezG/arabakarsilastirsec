# GitHub'a yapılan push'lar Netlify yayını başlatmaz (zamanlanmış görevler günde birçok kez push ediyor).
# Yayın yalnızca Netlify build hook'u ile tetiklenen derlemelerde yapılır (INCOMING_HOOK_URL dolu olur).
# ignore komutu 0 ile biterse derleme atlanır, 1 ile biterse yapılır.
[build]
  ignore = "if [ -n \"$INCOMING_HOOK_URL\" ]; then exit 1; else exit 0; fi"
