<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#101116"/>
      <stop offset="52%" stop-color="#181920"/>
      <stop offset="80%" stop-color="#2c2620"/>
      <stop offset="100%" stop-color="#4a3a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="58%" cy="58%" r="50%">
      <stop offset="0%"  stop-color="#E7D2A0" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#C9A961" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A961" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#332a1c"/>
      <stop offset="32%"  stop-color="#131217"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#101014"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="2400" height="760" fill="url(#sky)"/>
  <rect x="0" y="0" width="2400" height="760" fill="url(#glow)"/>

  <!-- distant skyline silhouette, sits on horizon y=430 -->
  <g fill="url(#bld)">
    <rect x="760"  y="330" width="54" height="100"/>
    <rect x="826"  y="360" width="34" height="70"/>
    <rect x="872"  y="300" width="64" height="130"/>
    <rect x="950"  y="372" width="40" height="58"/>
    <rect x="1004" y="268" width="46" height="162"/>
    <rect x="1064" y="345" width="70" height="85"/>
    <rect x="1148" y="222" width="40" height="208"/>
    <rect x="1200" y="360" width="54" height="70"/>
    <rect x="1268" y="300" width="34" height="130"/>
    <rect x="1316" y="350" width="60" height="80"/>
    <rect x="1392" y="288" width="42" height="142"/>
    <rect x="1448" y="378" width="52" height="52"/>
    <rect x="1514" y="320" width="32" height="110"/>
    <rect x="1560" y="358" width="58" height="72"/>
    <rect x="1632" y="298" width="40" height="132"/>
    <rect x="1686" y="392" width="46" height="38"/>
    <rect x="1748" y="345" width="34" height="85"/>
    <rect x="1796" y="368" width="62" height="62"/>
    <rect x="1872" y="320" width="36" height="110"/>
    <rect x="1922" y="398" width="52" height="32"/>
  </g>

  <!-- sparse window lights -->
  <g fill="#E7D2A0" opacity="0.5">
    <rect x="780"  y="355" width="4.5" height="7"/>
    <rect x="892"  y="330" width="4.5" height="7"/>
    <rect x="908"  y="390" width="4.5" height="7"/>
    <rect x="1022" y="300" width="4.5" height="7"/>
    <rect x="1038" y="340" width="4.5" height="7"/>
    <rect x="1088" y="375" width="4.5" height="7"/>
    <rect x="1164" y="260" width="4.5" height="7"/>
    <rect x="1164" y="300" width="4.5" height="7"/>
    <rect x="1224" y="392" width="4.5" height="7"/>
    <rect x="1338" y="382" width="4.5" height="7"/>
    <rect x="1410" y="316" width="4.5" height="7"/>
    <rect x="1580" y="392" width="4.5" height="7"/>
    <rect x="1650" y="330" width="4.5" height="7"/>
    <rect x="1814" y="396" width="4.5" height="7"/>
    <rect x="1888" y="352" width="4.5" height="7"/>
  </g>

  <!-- horizon haze to blend buildings into glow -->
  <rect x="0" y="418" width="2400" height="30" fill="url(#glow)" opacity="0.6"/>

  <!-- road -->
  <polygon points="0,760 2400,760 1350,432 950,432" fill="url(#road)"/>
  <polygon points="0,760 2400,760 1350,432 950,432" fill="url(#glow)" opacity="0.32"/>

  <!-- road edge lines -->
  <polygon points="0,760 46,760 962,432 953,432" fill="#C9A961" opacity="0.16"/>
  <polygon points="2354,760 2400,760 1350,432 1341,432" fill="#C9A961" opacity="0.16"/>

  <!-- centerline dashes, perspective -->
  <g fill="#E7D2A0" opacity="0.55">
    <rect x="1128" y="710" width="30" height="42"/>
    <rect x="1138" y="630" width="22" height="33"/>
    <rect x="1146" y="565" width="16" height="24"/>
    <rect x="1152" y="515" width="11" height="17"/>
    <rect x="1157" y="478" width="7"  height="11"/>
    <rect x="1160" y="450" width="4"  height="6"/>
  </g>

  <!-- motion light streaks -->
  <g filter="url(#soft)" opacity="0.5">
    <rect x="1420" y="535" width="380" height="10" fill="#E7D2A0" transform="rotate(-3 1610 540)"/>
    <rect x="1560" y="600" width="270" height="8" fill="#C9A961" transform="rotate(-3 1695 604)"/>
  </g>
  <g filter="url(#soft2)" opacity="0.65">
    <rect x="1460" y="537" width="230" height="3" fill="#F5F4F0"/>
    <rect x="1590" y="602" width="170" height="2.4" fill="#F5F4F0"/>
  </g>
</svg>
