name: İller arası mesafe tablosu
on:
  push:
    paths: ['tools/mesafe_hesapla.js', '.github/workflows/mesafe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mesafe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tabloyu üret
        run: node tools/mesafe_hesapla.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mesafeler.js
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "İller arası mesafe tablosu üretildi"
          B="${GITHUB_REF_NAME}"
          for i in 1 2 3; do git pull --rebase origin "$B" && git push origin HEAD:"$B" && break; sleep 10; done
